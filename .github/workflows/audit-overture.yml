name: Audit Overture speed coverage

on:
  workflow_dispatch:
    inputs:
      release:
        description: Overture release to audit
        required: false
        default: 2026-09-23.1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit tooling
        run: python -m pip install --upgrade duckdb shapely

      - name: Audit Overture transportation coverage
        env:
          OVERTURE_RELEASE: ${{ inputs.release }}
        run: python scripts/audit-overture.py

      - name: Upload Overture audit
        uses: actions/upload-artifact@v4
        with:
          name: overture-speed-coverage-${{ inputs.release }}
          path: data/overture-audit/
