name: Audit Overture speed coverage

on:
  push:
    paths:
      - "scripts/audit-overture.cjs"
      - ".github/workflows/audit-overture.yml"
  workflow_dispatch:
    inputs:
      release:
        description: Overture release to audit
        required: false
        default: 2026-09-23.1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Overture transportation coverage
        env:
          OVERTURE_RELEASE: ${{ inputs.release || '2026-09-23.1' }}
        run: npm run audit:overture

      - name: Upload Overture audit
        uses: actions/upload-artifact@v4
        with:
          name: overture-speed-coverage
          path: public/audit/overture-speed-coverage.json
          retention-days: 7
